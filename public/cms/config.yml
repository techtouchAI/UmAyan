backend:
  name: github
  repo: techtouchai/UmAyan
  branch: main
  # If you are using Decap CMS on a subpath, you might need OAuth configuration.
  # For GitHub pages, we usually rely on an external OAuth client or implicit grant if available.

media_folder: "public/images/uploads"
public_folder: "/UmAyan/images/uploads"

site_url: "https://techtouchai.github.io/UmAyan"
logo_url: "https://techtouchai.github.io/UmAyan/cms/logo.png"

# Save content in Arabic / RTL if the editor supports it
locale: "ar"

collections:
  - name: "settings"
    label: "إعدادات الموقع (Site Settings)"
    editor:
      preview: false
    files:
      - label: "الإعدادات العامة (General)"
        name: "general"
        file: "content/settings/general.json"
        fields:
          - {label: "اسم الموقع", name: "siteName", widget: "string"}
          - {label: "وصف الموقع", name: "siteDescription", widget: "text"}
          - {label: "صورة الملف الشخصي", name: "profileImage", widget: "image"}
          - label: "الزر العائم"
            name: "floatingButton"
            widget: "object"
            fields:
              - {label: "نوع الأيقونة", name: "iconType", widget: "string", default: "MessageCircle"}
              - {label: "الرابط أو الهاتف", name: "actionUrl", widget: "string"}
              - {label: "تفعيل", name: "enabled", widget: "boolean"}
          - label: "روابط التواصل الاجتماعي"
            name: "socialLinks"
            widget: "list"
            fields:
              - {label: "اسم المنصة", name: "platform", widget: "string"}
              - {label: "الرابط", name: "url", widget: "string"}
              - {label: "الأيقونة", name: "icon", widget: "string"}

  - name: "categories"
    label: "التصنيفات (Categories)"
    folder: "content/categories"
    create: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    fields:
      - {label: "العنوان", name: "title", widget: "string"}
      - {label: "الرابط (Slug)", name: "slug", widget: "string"}

  - name: "posts"
    label: "المنشورات (Posts)"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    fields:
      - {label: "العنوان", name: "title", widget: "string"}
      - {label: "الرابط (Slug)", name: "slug", widget: "string"}
      - {label: "التصنيف", name: "category", widget: "relation", collection: "categories", search_fields: ["title"], value_field: "slug", display_fields: ["title"]}
      - {label: "صورة طولية", name: "portraitImage", widget: "image"}
      - {label: "المحتوى", name: "bodyContent", widget: "markdown"}
      - {label: "الخاتمة", name: "conclusion", widget: "string", required: false}
      - {label: "SEO Meta Title", name: "seoMetaTitle", widget: "string"}
      - {label: "SEO Meta Description", name: "seoMetaDescription", widget: "text"}
